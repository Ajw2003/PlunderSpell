<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="sans-serif" font-size="13">
<rect width="400" height="220" fill="#14120E"/>
<text x="16" y="24" fill="#DCD2BA" font-size="15">Losing you: counted in rooms, not seconds</text>
<g stroke="#9A9078" stroke-width="3" fill="none"><rect x="16" y="50" width="88" height="110"/><rect x="112" y="50" width="88" height="110"/><rect x="208" y="50" width="88" height="110"/><rect x="304" y="50" width="80" height="110"/></g>
<rect x="16" y="50" width="88" height="110" fill="#2E4C41"/><rect x="112" y="50" width="88" height="110" fill="#2E4C41" opacity="0.7"/><rect x="208" y="50" width="88" height="110" fill="#2E4C41" opacity="0.4"/>
<circle cx="50" cy="110" r="10" fill="#DCD2BA"/><text x="30" y="180" fill="#5FA288">hunting</text>
<text x="128" y="180" fill="#5FA288">hunting</text><text x="222" y="180" fill="#5FA288">searching</text>
<circle cx="345" cy="110" r="7" fill="#C4542E"/><text x="312" y="180" fill="#C4542E">gives up</text>
