<path d="M287.2,384.0 L420,176 L406,176" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="287.2" cy="384.0" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="400" y="180" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="end">Out of a room's corner</text><text x="400" y="194" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="end">it enters through angles</text><path d="M676.0,420.0 L840,161 L854,161" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="676.0" cy="420.0" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="165" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">Plates, never a curve</text><text x="860" y="179" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">lapis-black, lit along each edge</text><path d="M1000.0,425.4 L840,221 L854,221" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="1000.0" cy="425.4" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="225" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">A hollow tongue</text><text x="860" y="239" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">it drinks time, not blood</text><path d="M791.2,690.0 L840,296 L854,296" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="791.2" cy="690.0" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="300" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">Feet are points</text><text x="860" y="314" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">ticks on stone, like a clock</text><path d="M748.0,510.0 L840,356 L854,356" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="748.0" cy="510.0" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="360" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">Shoulder 1.5 m, long 3.6 m</text><text x="860" y="374" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">drops to 1.0 m under a low arch</text>
<text x="860" y="500" font-family="Overpass Mono, monospace" font-size="10" fill="#635C4C" text-anchor="start" letter-spacing="2">AT TEN PACES</text><text x="860" y="516" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">Smoke curling from the corner of a room,</text><text x="860" y="532" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">then a long dark animal of hard edges</text><text x="860" y="548" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">stepping out of the angle itself.</text><text x="860" y="574" font-family="Overpass Mono, monospace" font-size="10" fill="#635C4C" text-anchor="start" letter-spacing="2">THE HINT IT GIVES</text><text x="860" y="590" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">It can only come out of corners. Round</text><text x="860" y="606" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">rooms, the spiral stair and the towers</text><text x="860" y="622" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">have none; there it must walk.</text><text x="860" y="648" font-family="Overpass Mono, monospace" font-size="10" fill="#635C4C" text-anchor="start" letter-spacing="2">BIBLE</text><text x="860" y="664" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">lapis used: bible exception, the owner's</text><text x="860" y="680" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">call</text>
<g id="palette" font-family="Overpass Mono, monospace" font-size="10" fill="#9A9078"><rect x="40" y="748" width="34" height="18" fill="#2A2638" stroke="#332D22" stroke-width=".6"/><text x="80" y="756">#2A2638</text><text x="80" y="767" fill="#635C4C">body (deep lapis)</text><rect x="210" y="748" width="34" height="18" fill="#B9B2D6" stroke="#332D22" stroke-width=".6"/><text x="250" y="756">#B9B2D6</text><text x="250" y="767" fill="#635C4C">edge light</text><rect x="380" y="748" width="34" height="18" fill="#7A6AA0" stroke="#332D22" stroke-width=".6"/><text x="420" y="756">#7A6AA0</text><text x="420" y="767" fill="#635C4C">smoke (lapis)</text><rect x="550" y="748" width="34" height="18" fill="#DCD2BA" stroke="#332D22" stroke-width=".6"/><text x="590" y="756">#DCD2BA</text><text x="590" y="767" fill="#635C4C">teeth (vellum)</text><rect x="720" y="748" width="34" height="18" fill="#14120E" stroke="#332D22" stroke-width=".6"/><text x="760" y="756">#14120E</text><text x="760" y="767" fill="#635C4C">bone black</text></g>
