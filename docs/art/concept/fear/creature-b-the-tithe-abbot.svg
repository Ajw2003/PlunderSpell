<path d="M490.0,153.6 L840,146 L854,146" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="490.0" cy="153.6" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="150" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">Sundial face, no eyes</text><text x="860" y="164" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">its gnomon's shadow tells the hour</text><path d="M446.8,182.4 L420,186 L406,186" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="446.8" cy="182.4" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="400" y="190" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="end">A ring of portal light</text><text x="400" y="204" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="end">lapis halo, 0.8 m</text><path d="M518.8,398.4 L840,261 L854,261" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="518.8" cy="398.4" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="265" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">The ledger, held open</text><text x="860" y="279" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">the demand and its sketches</text><path d="M572.8,603.6 L840,356 L854,356" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="572.8" cy="603.6" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="860" y="360" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">Hands that take</text><text x="860" y="374" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="start">fingers 0.22 m, lapis-black</text><path d="M443.2,679.2 L420,636 L406,636" fill="none" stroke="#9A9078" stroke-width=".8"/><circle cx="443.2" cy="679.2" r="2.6" fill="#DCD2BA" stroke="#14120E" stroke-width="1"/><text x="400" y="640" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="end">Hem thins to smoke</text><text x="400" y="654" font-family="Overpass Mono, monospace" font-size="10.5" fill="#9A9078" text-anchor="end">never touches the floor</text>
<text x="860" y="450" font-family="Overpass Mono, monospace" font-size="10" fill="#635C4C" text-anchor="start" letter-spacing="2">AT TEN PACES</text><text x="860" y="466" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">A monk far too tall, stooped under the</text><text x="860" y="482" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">vault, reading. Its head is a clock face,</text><text x="860" y="498" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">and it is reading about you.</text><text x="860" y="524" font-family="Overpass Mono, monospace" font-size="10" fill="#635C4C" text-anchor="start" letter-spacing="2">THE HINT IT GIVES</text><text x="860" y="540" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">It knows from the ledger who carries what</text><text x="860" y="556" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">it wants. It walks to them first; the</text><text x="860" y="572" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">empty-handed are found last.</text><text x="860" y="598" font-family="Overpass Mono, monospace" font-size="10" fill="#635C4C" text-anchor="start" letter-spacing="2">BIBLE</text><text x="860" y="614" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">lapis used: bible exception, the owner's</text><text x="860" y="630" font-family="Overpass Mono, monospace" font-size="12" fill="#DCD2BA" text-anchor="start">call</text>
<g id="palette" font-family="Overpass Mono, monospace" font-size="10" fill="#9A9078"><rect x="40" y="748" width="34" height="18" fill="#797463" stroke="#332D22" stroke-width=".6"/><text x="80" y="756">#797463</text><text x="80" y="767" fill="#635C4C">robe (vellum, dimmed)</text><rect x="210" y="748" width="34" height="18" fill="#DCD2BA" stroke="#332D22" stroke-width=".6"/><text x="250" y="756">#DCD2BA</text><text x="250" y="767" fill="#635C4C">ledger (vellum)</text><rect x="380" y="748" width="34" height="18" fill="#8C8A80" stroke="#332D22" stroke-width=".6"/><text x="420" y="756">#8C8A80</text><text x="420" y="767" fill="#635C4C">sundial pewter</text><rect x="550" y="748" width="34" height="18" fill="#7A6AA0" stroke="#332D22" stroke-width=".6"/><text x="590" y="756">#7A6AA0</text><text x="590" y="767" fill="#635C4C">halo (lapis)</text><rect x="720" y="748" width="34" height="18" fill="#2A2638" stroke="#332D22" stroke-width=".6"/><text x="760" y="756">#2A2638</text><text x="760" y="767" fill="#635C4C">hands (deep lapis)</text><rect x="890" y="748" width="34" height="18" fill="#14120E" stroke="#332D22" stroke-width=".6"/><text x="930" y="756">#14120E</text><text x="930" y="767" fill="#635C4C">bone black</text></g>
</svg>
