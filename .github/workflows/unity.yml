name: Unity

# Runs the Unity test suites (EditMode + PlayMode) via GameCI. EditMode includes
# ArtAssetImportTests, which is the Unity-side check on the generated props, so
# there is no separate -executeMethod job here — that entry point exists for
# running the same validation by hand (see Tools/AssetPipeline/README.md).
#
# SETUP REQUIRED: this needs a Unity licence in repo secrets as UNITY_LICENSE
# (personal) or UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD (pro). Until one
# exists the jobs skip rather than fail, so the workflow does not sit red.
# Activation instructions: https://game.ci/docs/github/activation

on:
  push:
    branches: [plunderspell-dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      licensed: ${{ steps.check.outputs.licensed }}
    steps:
      # The secrets context is not available in a job-level `if`, so resolve it
      # here and gate the real job on the output.
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "licensed=true" >> "$GITHUB_OUTPUT"
          else
            echo "licensed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Unity licence secret configured — skipping Unity tests. See .github/workflows/unity.yml"
          fi

  tests:
    needs: preflight
    if: needs.preflight.outputs.licensed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # reads 6000.3.15f1 from ProjectSettings/ProjectVersion.txt
          unityVersion: auto
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results
